<head>

<title>Stickman Fight — llersonYT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif;text-align:center;overflow-x:hidden}
h1{font-size:22px;margin:12px 0 6px}
#hud{display:flex;justify-content:space-around;gap:8px;max-width:720px;margin:auto;font-weight:700;font-size:13px;flex-wrap:wrap}
.bar{height:14px;background:#222;border:2px solid #fff;border-radius:10px;overflow:hidden;min-width:120px}
.fill{height:100%;transition:width .2s}
#pFill{background:#168cff} #eFill{background:#f33} #enFill{background:#ffd21a}
#game{position:relative;max-width:720px;height:430px;margin:10px auto;background:linear-gradient(#17264b,#11182b 65%,#25252d);border:3px solid #fff;border-radius:18px;overflow:hidden;touch-action:none}
.floor{position:absolute;left:0;right:0;bottom:0;height:72px;background:#171717;border-top:3px solid #555}
.fighter{position:absolute;bottom:68px;width:120px;height:230px;transition:left .08s}
#player{left:70px}
#enemy{right:70px}
.name{font-weight:900;text-shadow:2px 2px #000;margin-bottom:2px}
.troll{position:absolute;left:10px;bottom:24px;width:100px;height:150px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 5px 3px #000)}
.shadow{position:absolute;bottom:8px;left:22px;width:90px;height:15px;background:#0008;border-radius:50%}
.body{position:absolute;left:38px;top:55px;width:45px;height:72px;border-radius:14px;background:#d82020;border:4px solid #111;box-shadow:inset 0 -10px #851010}
.head{position:absolute;left:30px;top:4px;width:62px;height:62px;border-radius:50%;background:#d82020;border:4px solid #111}
.eye{position:absolute;top:20px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #111}
.eye.a{left:13px} .eye.b{right:13px}
.leg{position:absolute;top:118px;width:16px;height:62px;background:#8f0d0d;border:4px solid #111;border-radius:10px}
.leg.a{left:37px;transform:rotate(10deg)} .leg.b{left:68px;transform:rotate(-10deg)}
.arm{position:absolute;top:65px;width:18px;height:72px;background:#d82020;border:4px solid #111;border-radius:10px}
.arm.a{left:16px;transform:rotate(30deg)} .arm.b{right:12px;transform:rotate(-30deg)}
.cape{position:absolute;left:75px;top:60px;width:42px;height:80px;background:#f22;border:3px solid #111;clip-path:polygon(0 0,100% 12%,75% 100%,20% 78%);z-index:0}
.enemyChar>*{z-index:2}
.hit{animation:hit .18s}
@keyframes hit{50%{transform:translateX(-8px) rotate(-3deg)}}
@keyframes attack{50%{transform:translateX(20px) rotate(4deg)}}
.attacking{animation:attack .22s}
#msg{min-height:28px;font-weight:900;font-size:16px;margin:5px}
.controls{position:absolute;left:10px;right:10px;bottom:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.side{display:flex;gap:7px;pointer-events:auto}
button{border:2px solid #fff;background:#26334f;color:#fff;border-radius:12px;font-size:18px;font-weight:900;min-width:52px;min-height:48px;box-shadow:0 4px 0 #0008;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0008}
#rayo{min-width:86px;font-size:14px;background:#075ee8}
#reset{margin:7px auto 14px;min-width:120px}
.small{font-size:11px;opacity:.8}
</style>

s:18px;box-shadow:0 0 25px #fff8">

  <button onclick="document.getElementById('victory').style.display='none';document.getElementById('reset').click()" style="margin-top:12px;border:2px solid #fff;background:#26334f;color:#fff;border-radius:12px;font-size:18px;font-weight:900;padding:12px 18px">🔄 JUGAR OTRA VEZ</button>
</div>
<script>
let level=1, pHP=100, maxHP=100, eHP=100, energy=0, combo=0, done=false;
const player=document.getElementById('player'), enemy=document.getElementById('enemy');
const pFill=document.getElementById('pFill'), eFill=document.getElementById('eFill'), enFill=document.getElementById('enFill');
const msg=document.getElementById('msg'), enemyName=document.getElementById('enemyName');
const names=['','MauricioRIVALS','SANTIAGO','JEFE FINAL'];
const maxes=[0,100,150,250];
let px=70, ex=0, comboTimer;

function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function update(){
  pFill.style.width=(pHP/100*100)+'%';
  eFill.style.width=(eHP/maxHP*100)+'%';
  enFill.style.width=energy+'%';
  player.style.left=px+'px';
  enemy.style.right=ex+'px';
}
function attack(base,label){
  if(done)return;
  combo=Math.min(8,combo+1);
  clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>combo=0,1200);
  const dmg=base+(combo-1)*3;
  eHP=Math.max(0,eHP-dmg);
  energy=Math.min(100,energy+20);
  enemy.classList.remove('hit'); void enemy.offsetWidth; enemy.classList.add('hit');
  msg.textContent=label+' 💥 '+dmg+' daño · COMBO x'+combo;
  if(eHP<=0) nextLevel();
  update();
}
function nextLevel(){
  if(level>=3){
    done=true; eHP=0; msg.textContent='🔥 ¡JEFE FINAL DERROTADO!'; update(); setTimeout(()=>{document.getElementById('victory').style.display='flex';},350); return;
  }
  level++; maxHP=maxes[level]; eHP=maxHP; enemyName.textContent=names[level];
  pHP=100; energy=0; combo=0; msg.textContent='🔥 ¡Nivel '+level+'! ¡Ahora es más fuerte!';
  update();
}
function enemyAttack(){
  if(done)return;
  const dmg=8+level*2;
  pHP=Math.max(0,pHP-dmg);
  player.classList.remove('hit'); void player.offsetWidth; player.classList.add('hit');
  msg.textContent='💥 ¡El enemigo atacó! -'+dmg+' HP';
  if(pHP<=0){msg.textContent='☠️ ¡Perdiste! Pulsa 🔄 para intentar otra vez'; done=true}
  update();
}
function move(dx){ if(done)return; px=clamp(px+dx,10,game.clientWidth-140); update(); }
document.getElementById('left').onclick=()=>move(-25);
document.getElementById('right').onclick=()=>move(25);
document.getElementById('punch').onclick=()=>attack(12,'👊 ¡PUÑETAZO!');
document.getElementById('kick').onclick=()=>attack(15,'🦵 ¡PATADA!');
document.getElementById('rayo').onclick=()=>{
  if(done)return;
  if(energy<100){msg.textContent='⚡ Necesitas 100 de energía';return}
  energy=0; eHP=Math.round(maxHP*.5); msg.textContent='⚡ ¡RAYO AZUL! ¡50% HP!';
  enemy.classList.add('hit'); update();
};
document.getElementById('reset').onclick=()=>{level=1;pHP=100;maxHP=100;eHP=100;energy=0;combo=0;done=false;enemyName.textContent=names[1];msg.textContent='🔥 ¡Nivel 1! ¡Pelea!';px=70;update()};
setInterval(enemyAttack,1800);
update();
</script>
